[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grounding-mle"
version = "0.1.0"
description = "Reproducible experiments for external grounding in recursive self-training"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "pandas>=2.1,<3",
  "matplotlib>=3.8,<4",
  "PyYAML>=6,<7",
  "requests>=2.31,<3",
  "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
llm = [
  "accelerate>=1.0,<2",
  "datasets>=3.0,<5",
  "evalplus==0.3.1",
  "huggingface-hub>=0.35,<1",
  "peft>=0.13,<1",
  "torch>=2.4,<3",
  "transformers>=4.55,<5",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
grounding-mle = "grounding_mle.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
